name: model-tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run passive rib reference screen
        run: python simulations/passive_rib_screen.py > /tmp/reference-screen.txt
      - name: Run split sensible-heat and vapor-transfer screen
        run: python simulations/split_heat_mass_screen.py > /tmp/split-transfer-screen.txt
      - name: Run deterministic split-transfer sensitivity screen
        run: python simulations/split_transfer_sensitivity.py > /tmp/split-transfer-sensitivity.txt
      - name: Run E3 periodic rib diffusion screen
        run: python simulations/rib_diffusion_screen.py > /tmp/e3-diffusion-screen.txt
      - name: Run prescribed-state moist-air corridor buoyancy screen
        run: python simulations/corridor_buoyancy_screen.py > /tmp/corridor-buoyancy-screen.txt
      - name: Run self-consistent 1D corridor screen
        run: python simulations/self_consistent_corridor_1d.py > /tmp/self-consistent-corridor.txt
      - name: Run open-valley renewal target screen
        run: python simulations/open_valley_exchange_target.py > /tmp/open-valley-renewal-target.txt
      - name: Run distributed open-valley advection-diffusion screen
        run: python simulations/open_valley_distributed_1d.py > /tmp/open-valley-distributed.txt
      - name: Run 2D heat-spreader orientation demo
        run: python simulations/heat_spreader_2d.py > /tmp/heat-spreader-demo.txt
      - name: Run normalized water-salt screen
        run: python simulations/water_salt_1d.py > /tmp/water-salt-screen.txt
      - name: Generate reproducible reference package
        run: |
          python simulations/generate_reference_outputs.py --output-root /tmp/reference-output
          test -s /tmp/reference-output/data/passive_equilibrium_branches.csv
          test -s /tmp/reference-output/data/split_heat_mass_screen.csv
          test -s /tmp/reference-output/data/split_transfer_sensitivity.csv
          test -s /tmp/reference-output/data/split_transfer_sensitivity_summary.csv
          test -s /tmp/reference-output/data/corridor_buoyancy_screen.csv
          test -s /tmp/reference-output/data/corridor_neutral_density_curve.csv
          test -s /tmp/reference-output/data/self_consistent_corridor_1d.csv
          test -s /tmp/reference-output/data/open_valley_renewal_targets.csv
          test -s /tmp/reference-output/data/heat_spreader_orientation.csv
          test -s /tmp/reference-output/data/water_salt_parameter_screen.csv
          test -s /tmp/reference-output/data/rib_diffusion_boundary_layer.csv
          test -s /tmp/reference-output/figures/passive_equilibrium_branches.png
          test -s /tmp/reference-output/figures/rib_diffusion_boundary_layer.png
          test -s /tmp/reference-output/metadata.json
          test -s /tmp/reference-output/sha256.txt
