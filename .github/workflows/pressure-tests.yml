name: pressure-tests

on:
  pull_request:
    paths:
      - "simulations/spatial_pressure_layout.py"
      - "simulations/protected_air_channel_tradeoff.py"
      - "simulations/load_schedule_policy.py"
      - "simulations/protected_support_skeleton.py"
      - "simulations/terminal_route_coddesign.py"
      - "simulations/pressure_weighted_liquid_routes.py"
      - "tests/test_spatial_pressure_layout.py"
      - "tests/test_protected_air_channel_tradeoff.py"
      - "tests/test_load_schedule_policy.py"
      - "tests/test_protected_support_skeleton.py"
      - "tests/test_terminal_route_coddesign.py"
      - "tests/test_pressure_weighted_liquid_routes.py"
      - "data/spatial_pressure_primary_24x24.csv"
      - "data/protected_air_channel_primary_24x24.csv"
      - "data/load_schedule_policy_primary_24x24.csv"
      - "data/protected_support_frontier_primary_24x24.csv"
      - "data/terminal_route_coddesign_reference.csv"
      - "data/pressure_weighted_liquid_route_reference.csv"
      - ".github/workflows/pressure-tests.yml"
  workflow_dispatch:

jobs:
  pressure-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy pytest
      - name: Run pressure-layout regression tests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_spatial_pressure_layout.py
          tests/test_protected_air_channel_tradeoff.py
          tests/test_load_schedule_policy.py
          tests/test_protected_support_skeleton.py
          tests/test_terminal_route_coddesign.py
          tests/test_pressure_weighted_liquid_routes.py
