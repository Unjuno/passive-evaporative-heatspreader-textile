name: pressure-tests

on:
  pull_request:
    paths:
      - "simulations/spatial_pressure_layout.py"
      - "simulations/protected_air_channel_tradeoff.py"
      - "tests/test_spatial_pressure_layout.py"
      - "tests/test_protected_air_channel_tradeoff.py"
      - "data/spatial_pressure_primary_24x24.csv"
      - "data/protected_air_channel_primary_24x24.csv"
      - ".github/workflows/pressure-tests.yml"
  workflow_dispatch:

jobs:
  pressure-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy pytest
      - name: Run pressure-layout regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_spatial_pressure_layout.py tests/test_protected_air_channel_tradeoff.py
