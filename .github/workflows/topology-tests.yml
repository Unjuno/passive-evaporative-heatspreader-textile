name: topology-tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run 2D topology regressions
        run: python -m pytest -q tests/test_spreader_topology_2d.py
      - name: Run equal-material 2D topology screen
        run: python simulations/spreader_topology_2d.py > /tmp/spreader-topology-2d.txt
