name: garment-tests

on:
  pull_request:
    paths:
      - "simulations/virtual_garment_bom.py"
      - "simulations/integrated_virtual_prototype_vpe.py"
      - "tests/test_virtual_garment_bom.py"
      - "tests/test_integrated_virtual_prototype_vpe.py"
      - "data/virtual_garment_bom_reference.csv"
      - "data/integrated_vpe_environment_reference.csv"
      - "data/integrated_vpe_liquid_reference.csv"
      - ".github/workflows/garment-tests.yml"
  workflow_dispatch:

jobs:
  virtual-garment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy pytest
      - name: Run virtual-garment regression tests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_virtual_garment_bom.py
          tests/test_integrated_virtual_prototype_vpe.py
