name: verify-v1.0.0

on:
  pull_request:
    paths:
      - '.github/workflows/publish-v1.yml'
      - 'CITATION.cff'
      - 'docs/release-notes-v1.0.0.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_SHA: e544f64630119c88425b49cc3e5a00e06d15ad84
      RELEASE_DIR: reference-output-v1.0.0
      RELEASE_ZIP: reference-output-v1.0.0.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify immutable release tag and metadata
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          grep -q '^version: 1.0.0$' CITATION.cff
          grep -q '^date-released: 2026-08-20$' CITATION.cff
          test -s docs/release-notes-v1.0.0.md

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full regression suite at v1.0.0
        run: python -m pytest -q

      - name: Verify indexed direct execution
        run: python simulations/branched_liquid_resistor_network.py > /tmp/branched-network-direct.csv

      - name: Regenerate exact-release reference package from outside checkout
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/simulations/generate_reference_outputs.py" \
            --output-root "$RUNNER_TEMP/$RELEASE_DIR"
          grep -q "\"git_commit\": \"$RELEASE_SHA\"" \
            "$RUNNER_TEMP/$RELEASE_DIR/metadata.json"
          test -s "$RUNNER_TEMP/$RELEASE_DIR/sha256.txt"

      - name: Build verification archive and checksum
        run: |
          cd "$RUNNER_TEMP"
          python -m zipfile -c "$RELEASE_ZIP" "$RELEASE_DIR"
          sha256sum "$RELEASE_ZIP" > "$RELEASE_ZIP.sha256"
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_ZIP.sha256"

      - name: Upload verification package
        uses: actions/upload-artifact@v4
        with:
          name: verify-v1.0.0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reference-output-v1.0.0.zip
            ${{ runner.temp }}/reference-output-v1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 90
