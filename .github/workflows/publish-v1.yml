name: publish-v1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-v1:
    if: github.repository == 'Unjuno/passive-evaporative-heatspreader-textile'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_DIR: reference-output-v1.0.0
      RELEASE_ZIP: reference-output-v1.0.0.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify release metadata
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '^version: 1.0.0$' CITATION.cff
          grep -q '^date-released: 2026-08-20$' CITATION.cff
          test -s docs/release-notes-v1.0.0.md

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Verify indexed direct execution
        run: python simulations/branched_liquid_resistor_network.py > /tmp/branched-network-direct.csv

      - name: Generate exact-commit reference package from outside checkout
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/simulations/generate_reference_outputs.py" \
            --output-root "$RUNNER_TEMP/$RELEASE_DIR"
          grep -q "\"git_commit\": \"$GITHUB_SHA\"" \
            "$RUNNER_TEMP/$RELEASE_DIR/metadata.json"
          test -s "$RUNNER_TEMP/$RELEASE_DIR/sha256.txt"

      - name: Build release archive and checksum
        run: |
          cd "$RUNNER_TEMP"
          python -m zipfile -c "$RELEASE_ZIP" "$RELEASE_DIR"
          sha256sum "$RELEASE_ZIP" > "$RELEASE_ZIP.sha256"
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_ZIP.sha256"

      - name: Create immutable v1.0.0 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; leaving the existing stable release unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/$RELEASE_ZIP" \
            "$RUNNER_TEMP/$RELEASE_ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG — Passive Evaporative Heat-Spreader Textile" \
            --notes-file docs/release-notes-v1.0.0.md \
            --latest
