name: liquid-tests

on:
  pull_request:
    paths:
      - "simulations/capillary_liquid_network.py"
      - "simulations/capillary_architecture_tradeoff.py"
      - "simulations/capillary_practical_constraints.py"
      - "simulations/capillary_radius_collapse.py"
      - "simulations/salt_leakage_budget.py"
      - "tests/test_capillary_liquid_network.py"
      - "tests/test_capillary_architecture_tradeoff.py"
      - "tests/test_capillary_practical_constraints.py"
      - "tests/test_capillary_radius_collapse.py"
      - "tests/test_salt_leakage_budget.py"
      - "data/capillary_liquid_reference.csv"
      - "data/capillary_architecture_reference.csv"
      - "data/capillary_practical_reference.csv"
      - "data/capillary_radius_collapse_reference.csv"
      - "data/salt_leakage_budget_reference.csv"
      - ".github/workflows/liquid-tests.yml"
  workflow_dispatch:

jobs:
  capillary-liquid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Run capillary-liquid regression tests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_capillary_liquid_network.py
          tests/test_capillary_architecture_tradeoff.py
          tests/test_capillary_practical_constraints.py
          tests/test_capillary_radius_collapse.py
          tests/test_salt_leakage_budget.py
